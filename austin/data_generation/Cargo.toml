[package]
name = "all"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
csv = "1.3.1"
itertools = "0.14.0"
polars = { version = "0.46.0", features = ["lazy", "csv", "is_in", "cross_join", "decompress", "dtype-categorical", "polars-ops", "streaming", "dtype-struct", "strings"] }
rayon = "1.10.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
